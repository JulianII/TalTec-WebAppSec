<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <!-- Login View -->
    <div id="view-login" class="view">
        <div class="container">
            <h1>Login</h1>
            <form id="login-form">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="login-password" required>
                </div>
                <div id="login-error" class="error hidden"></div>
                <button type="submit">Login</button>
            </form>
            <p><a href="#" id="goto-register">Register</a></p>
        </div>
    </div>

    <!-- Register View -->
    <div id="view-register" class="view hidden">
        <div class="container">
            <h1>Register</h1>
            <form id="register-form">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="register-password" required minlength="12">
                </div>
                <div class="form-group">
                    <label>Verify Password:</label>
                    <input type="password" id="register-verify-password" required>
                </div>
                <div id="register-error" class="error hidden"></div>
                <button type="submit">Register</button>
            </form>
            <p><a href="#" id="goto-login">Login</a></p>
        </div>
    </div>

    <!-- TOTP Setup View -->
    <div id="view-totp-setup" class="view hidden">
        <div class="container">
            <h1>Setup 2FA</h1>
            <p>Scan this QR code with your authenticator app:</p>
            <div id="totp-qr-code"></div>
            <p>Or enter this secret manually:</p>
            <div id="totp-secret" class="secret"></div>
            <form id="totp-verify-form">
                <div class="form-group">
                    <label>Enter 6-digit code:</label>
                    <input type="text" id="totp-code" required pattern="[0-9]{6}" maxlength="6">
                </div>
                <div id="totp-error" class="error hidden"></div>
                <button type="submit">Enable 2FA</button>
            </form>
        </div>
    </div>

    <!-- TOTP Upgrade View -->
    <div id="view-totp-upgrade" class="view hidden">
        <div class="container">
            <h1>Verify 2FA</h1>
            <p>Enter the 6-digit code from your authenticator app:</p>
            <form id="totp-upgrade-form">
                <div class="form-group">
                    <label>Code:</label>
                    <input type="text" id="totp-upgrade-code" required pattern="[0-9]{6}" maxlength="6">
                </div>
                <div id="totp-upgrade-error" class="error hidden"></div>
                <button type="submit">Verify</button>
            </form>
            <button type="button" id="totp-upgrade-logout-btn">Back to login</button>
        </div>
    </div>

    <!-- Vault View -->
    <div id="view-vault" class="view hidden">
        <div class="container">
            <h1>Vault</h1>
            <div id="user-info"></div>
            <p>Manage your saved credentials in the vault.</p>
            <a class="button-link" href="/vault.html">Open vault entries</a>
            <form id="vault-form" class="hidden">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="vault-title" required>
                </div>
                <div class="form-group">
                    <label>Website:</label>
                    <input type="text" id="vault-website">
                </div>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="vault-username">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="vault-password">
                </div>
                <button type="submit">Save</button>
                <button type="button" id="vault-cancel">Cancel</button>
            </form>
            <button id="add-entry-btn">Add Entry</button>
            <button id="logout-btn">Logout</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
